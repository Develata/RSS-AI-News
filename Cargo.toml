[workspace]
members = [
    ".",
    "crates/cli",
    "crates/domain",
    "crates/config",
    "crates/runtime",
    "crates/storage",
    "crates/feed",
    "crates/extractor",
    "crates/ai",
    "crates/report",
    "crates/publish",
    "crates/observability",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Develata/RSS-AI-News"

# W11-P4-fix2.H2：error-and-observability §3.3 "禁止静默吞错" 第 1 层 enforcement
# 落地（task T101 W1 阶段就承诺，迁延至发布前补齐）。三层 enforcement：
#   1) workspace.lints —— 编译期 deny / warn（本节）
#   2) CI .ci/check_swallowed_errors.sh 文本扫描（已落地）
#   3) code review 人工守门
#
# `unused_must_use=deny`：丢弃 `Result<_, _>` 等 #[must_use] 返回值即编译失败。
# `clippy::let_underscore_must_use=deny`：`let _ = result_or_future()` 静默丢弃即拒绝。
# `clippy::let_underscore_future=deny`：丢弃 future 而不 await 即拒绝。
# `clippy::ok_expect=warn`：`.ok().expect(_)` 退化为 `.expect`，让 panic 信息保留 Err 上下文。
# `clippy::ignored_unit_patterns=warn`：`match _ { ... }` 等忽略 unit-like enum 的写法易隐藏失败分支。
#
# `priority = -1` 保留 crate-level allow 优先级——单文件 `#[allow(...)]` 覆盖此处。
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
let_underscore_future = "deny"
ok_expect = "warn"
ignored_unit_patterns = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "time", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
prometheus = { version = "0.13", default-features = false }
once_cell = "1"
regex = "1"
fs2 = "0.4"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
fastrand = "2"

# URL
url = "2"

# Unique IDs
ulid = "1"

# Environment
dotenvy = "0.15"

# Feed parsing
feed-rs = "2.4"

# Testing
tempfile = "3"

# AI client
async-openai = "0.27"

# GitHub API
# Octocrab 0.54 即使 personal-token path 也要求一个 JWT backend；选择 AWS-LC，
# 避免 jwt-rust-crypto 把无修复版 RUSTSEC-2023-0071 的 RSA 拉进 active graph。
octocrab = { version = "0.54", default-features = false, features = ["follow-redirect", "retry", "rustls", "timeout", "tracing", "default-client", "rustls-ring", "jwt-aws-lc-rs"] }

# HTML parsing
scraper = "0.22"

# Workspace crates (internal)
rss-ai-news-cli = { path = "crates/cli" }
rss-ai-news-domain = { path = "crates/domain" }
rss-ai-news-config = { path = "crates/config" }
rss-ai-news-runtime = { path = "crates/runtime" }
rss-ai-news-storage = { path = "crates/storage" }
rss-ai-news-feed = { path = "crates/feed" }
rss-ai-news-extractor = { path = "crates/extractor" }
rss-ai-news-ai = { path = "crates/ai" }
rss-ai-news-report = { path = "crates/report" }
rss-ai-news-publish = { path = "crates/publish" }
rss-ai-news-observability = { path = "crates/observability" }

[package]
name = "rss-ai-news"
version.workspace = true
edition.workspace = true

[dependencies]
rss-ai-news-cli.workspace = true
rss-ai-news-config.workspace = true
rss-ai-news-observability.workspace = true
rss-ai-news-runtime.workspace = true
rss-ai-news-storage.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
