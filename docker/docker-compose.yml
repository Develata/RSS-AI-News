services:
  rss-ai-news:
    profiles: ["runtime"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: rss-ai-news:runtime
    env_file:
      - ../.env
    volumes:
      - ../configs:/app/configs:ro
      - ../data:/app/data
    command: ["--help"]

  rss-ai-news-debug:
    profiles: ["debug"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: debug
    image: rss-ai-news:debug
    env_file:
      - ../.env
    volumes:
      - ../configs:/app/configs:ro
      - ../data:/app/data
    command: ["--help"]
