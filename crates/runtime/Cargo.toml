[package]
name = "rss-ai-news-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
rss-ai-news-domain.workspace = true
rss-ai-news-config.workspace = true
rss-ai-news-storage.workspace = true
rss-ai-news-feed.workspace = true
rss-ai-news-extractor.workspace = true
rss-ai-news-ai.workspace = true
rss-ai-news-report.workspace = true
rss-ai-news-publish.workspace = true
# Used by RunEventEmitter to redact secrets from `context_json` payloads
# before they hit the run_events table (W2-B-4 / error-and-observability
# §4.2). Pulls in only the redact module — no transitive deps on cli/
# storage/runtime, so no dependency cycle is introduced.
rss-ai-news-observability.workspace = true
async-trait = "0.1"
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
fastrand.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
time.workspace = true
ulid.workspace = true
sqlx.workspace = true

[dev-dependencies]
rss-ai-news-ai.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros"] }
tempfile.workspace = true

[lints]
workspace = true