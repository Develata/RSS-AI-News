[package]
name = "rss-ai-news-extractor"
version.workspace = true
edition.workspace = true

[dependencies]
rss-ai-news-domain.workspace = true
reqwest.workspace = true
scraper.workspace = true
thiserror.workspace = true
sha2.workspace = true
async-trait = "0.1"
hex.workspace = true
readability-rust = "0.1"
