[package]
name = "rss-ai-news-publish"
version.workspace = true
edition.workspace = true

[dependencies]
rss-ai-news-domain.workspace = true
async-trait = "0.1"
base64 = "0.22"
octocrab.workspace = true
# octocrab 0.44 `personal_token` accepts `impl Into<secrecy::SecretString>`;
# we materialise its argument at the boundary from our own SecretString so
# the raw token is never held as a plain `String` outside of that call site.
secrecy = "0.10"
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true