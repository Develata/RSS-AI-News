[package]
name = "rss-ai-news-decision"
version.workspace = true
edition.workspace = true

# Typed-decision capability (ADR 0010). Self-contained so it can be removed
# whole: other crates only pass raw config sections through and call
# `config::validate_sections` from validate-config.
[dependencies]
rss-ai-news-domain.workspace = true
async-trait = "0.1"
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints]
workspace = true
