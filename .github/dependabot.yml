version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # No automatic rebase: every main push that touched Cargo.lock rebased the
    # open group PR and re-ran its full CI (4 of PR #1's 5 runs). Merges to main
    # are still tested by the push CI; comment `@dependabot rebase` when a fresh
    # PR result is wanted.
    rebase-strategy: disabled
    groups:
      cargo-compatible:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Workflow actions are pinned to full commit SHAs with a `# vX.Y.Z` comment;
  # Dependabot bumps the SHA and the comment together. Same conservative
  # cadence and grouping as cargo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      actions-compatible:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Base images in docker/Dockerfile are pinned by digest; this keeps the
  # digests (Debian / Rust image security rebuilds) fresh. The Rust image's
  # version is the toolchain pin, which rust-toolchain.toml owns and the
  # static acceptance lane checks for drift (`toolchain-pins`), so its version
  # bumps are ignored here: a toolchain upgrade is a deliberate change of every
  # pin at once. Digest updates for the same tag still arrive.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      docker-base-images:
        patterns: ['*']
    ignore:
      - dependency-name: rust
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
