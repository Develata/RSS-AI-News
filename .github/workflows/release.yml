name: release

# 触发：push tag v*（如 v0.1.0 / v0.1.1 / v1.0.0）。
# 由 `git push origin <tag>` 或在 GitHub Releases 页面创建 release 触发。
#
# 不触发于 branch push / PR —— release 必须经过显式 tag。
on:
  push:
    tags: ['v*']

# GITHUB_TOKEN 默认 contents:read packages:none；publish-image 需要 packages:write。
permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # 与 ci.yml 保持一致；bump 时同步两处。
  RUST_TOOLCHAIN: "1.94.0"
  # GHCR 镜像名：ghcr.io/<owner>/<repo>。docker/metadata-action 会自动 lowercase
  # github.repository（`Develata/RSS-AI-News` -> `develata/rss-ai-news`）。
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish-image:
    name: publish runtime + scheduler images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # 登录 GHCR：用 GITHUB_TOKEN，无需额外 secret。
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成 runtime image tag 集：
      #   - v0.1.0   -> 0.1.0
      #   - v0.1.0   -> 0.1
      #   - v0.1.0   -> latest
      #   - v0.1.0-rc1 -> 0.1.0-rc1（不打 latest / 不打 0.1）
      # 注意：release workflow 触发于 `on: push tags`，此时 github.ref 是
      # refs/tags/...，`{{is_default_branch}}` 永远 false，不能依赖它管
      # latest；改用「tag 内不含 '-'」判定正式 release。
      - id: meta-runtime
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # 复用 ci.yml docker-build job 的 buildx cache（scope=runtime），避免
      # release 重新编译整个 Rust workspace。
      - name: build + push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # scheduler image tag 集（runtime 镜像之上叠一层 supercronic +
      # entrypoint，用于「常驻容器内置 cron 周期触发 single-shot CLI」
      # 部署模式）。flavor suffix 让所有 tag 自动加 `-scheduler`：
      #   - v0.1.0   -> 0.1.0-scheduler / 0.1-scheduler / latest-scheduler
      #   - v0.1.0-rc1 -> 0.1.0-rc1-scheduler（不打 latest-scheduler）
      - id: meta-scheduler
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-scheduler,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: build + push scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: true
          tags: ${{ steps.meta-scheduler.outputs.tags }}
          labels: ${{ steps.meta-scheduler.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=scheduler
