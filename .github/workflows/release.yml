name: release

# 触发：push tag v*（如 v0.1.0 / v0.1.1 / v1.0.0）。
# 由 `git push origin <tag>` 或在 GitHub Releases 页面创建 release 触发。
#
# 不触发于 branch push / PR —— release 必须经过显式 tag。
on:
  push:
    tags: ['v*']

# GITHUB_TOKEN 默认 contents:read packages:none；只有 publish-image / promote-tags
# 两个 job 声明 packages:write。
permissions:
  contents: read

env:
  # CARGO_* / RUST_* values are hashed into the rust-cache key: keep them equal
  # to ci.yml so the verify jobs can restore its caches.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 与 rust-toolchain.toml 的 channel 一致（static lane `toolchain-pins` 检查全部 pin）。
  RUST_TOOLCHAIN: "1.97.0"
  # GHCR 镜像名：ghcr.io/<owner>/<repo>。docker/metadata-action 会自动 lowercase
  # github.repository（`Develata/RSS-AI-News` -> `develata/rss-ai-news`）。
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Gate: the tag must name the version the workspace, lockfile, README and
  # binary declare, and on the tagged commit (every job checks out the tag's
  # SHA) the `local` profile (static, workspace, sqlite, release lanes), the
  # postgres lane against a PostgreSQL service and `cargo audit` must pass.
  # Images are only pushed after all four verify jobs succeed.
  #
  # The lanes are split like ci.yml's `test` / `test-pg` jobs and restore the
  # caches those jobs saved on main (same shared-key and env; tag runs may
  # read default-branch caches). save-if is off: a tag-scoped
  # cache is unreachable from later tags. A cache miss only costs time.
  verify-test:
    name: acceptance static + workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - run: command -v rg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - run: cargo acceptance run --lane static --lane workspace

  verify-release:
    name: acceptance sqlite + release (tag version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-pg
          save-if: false
      - run: cargo acceptance run --lane sqlite --lane release --expected-version "${GITHUB_REF_NAME#v}"

  # Mirrors ci.yml `test-pg` (same service, DATABASE_URL and cache key), for
  # the postgres lane only: sqlite and release already run in verify-release.
  verify-postgres:
    name: acceptance postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-pg
          save-if: false
      - run: cargo acceptance run --lane postgres

  # Same RustSec check as audit.yml / maintenance.yml, on the tagged graph:
  # an advisory published since the last main run blocks the release.
  verify-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/cargo-audit

  # Two stages so a failed or re-run release never leaves the moving tags
  # unpaired or moves them backwards:
  #   1. publish-image pushes only the immutable version tags (X.Y.Z and
  #      X.Y.Z-scheduler) and records both digests.
  #   2. promote-tags runs only after both pushes succeed. It points latest /
  #      X.Y (and their -scheduler twins) at those digests, and only when the
  #      tag is the highest stable tag overall / of its X.Y line
  #      (.github/scripts/release-promotion.sh, tested by the static lane).
  # A prerelease tag never gets here (verify-release only accepts X.Y.Z), and
  # the script refuses anything but X.Y.Z as well.
  publish-image:
    name: publish runtime + scheduler version tags to GHCR
    needs: [verify-test, verify-release, verify-postgres, verify-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      runtime-digest: ${{ steps.push-runtime.outputs.digest }}
      scheduler-digest: ${{ steps.push-scheduler.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 登录 GHCR：用 GITHUB_TOKEN，无需额外 secret。
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version tag only (v0.1.0 -> 0.1.0); the moving tags are promote-tags'.
      # metadata-action lowercases the image name and supplies the OCI labels.
      # `latest=false`: its default flavor (`latest=auto`) adds `latest` for
      # every type=semver tag, which would move latest here, before both
      # images exist and regardless of tag order.
      - id: meta-runtime
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      # 复用 ci.yml docker-build job 的 buildx cache（scope=runtime），避免
      # release 重新编译整个 Rust workspace。
      - name: build + push runtime image
        id: push-runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          # Read main's cache only: a tag-scoped cache is unreachable from later
          # tags and main, so exporting one would only cost time and quota.
          cache-from: type=gha,scope=runtime

      # scheduler image（runtime 镜像之上叠一层 supercronic + entrypoint，用于
      # 「常驻容器内置 cron 周期触发 single-shot CLI」部署模式）：
      #   v0.1.0 -> 0.1.0-scheduler
      - id: meta-scheduler
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-scheduler
          tags: |
            type=semver,pattern={{version}}

      - name: build + push scheduler image
        id: push-scheduler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: true
          tags: ${{ steps.meta-scheduler.outputs.tags }}
          labels: ${{ steps.meta-scheduler.outputs.labels }}
          cache-from: type=gha,scope=runtime

  promote-tags:
    name: promote latest / X.Y tags
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Serialise promotions across tags: two releases never move the aliases
    # at the same time. Not cancel-in-progress, so a running promotion
    # finishes. (GitHub keeps at most one pending run per group; a pending
    # promotion superseded by a newer tag's is outranked by it anyway.)
    concurrency:
      group: release-promote-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The checkout is shallow and holds only this tag, so list the remote's
      # tags instead; the script fails if this version is not among them.
      - id: decide
        name: decide which aliases this tag may move
        run: |
          set -o pipefail
          git ls-remote --tags origin 'refs/tags/v*' \
            | sh .github/scripts/release-promotion.sh "${GITHUB_REF_NAME#v}" \
            | tee -a "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.latest == 'true' || steps.decide.outputs.minor == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.decide.outputs.latest == 'true' || steps.decide.outputs.minor == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools create copies the pushed index under the new tags (no
      # rebuild). The sources are the digests publish-image recorded, so a tag
      # moved in between cannot be picked up instead.
      - if: steps.decide.outputs.latest == 'true' || steps.decide.outputs.minor == 'true'
        name: promote tags
        env:
          LATEST: ${{ steps.decide.outputs.latest }}
          MINOR: ${{ steps.decide.outputs.minor }}
          RUNTIME_DIGEST: ${{ needs.publish-image.outputs.runtime-digest }}
          SCHEDULER_DIGEST: ${{ needs.publish-image.outputs.scheduler-digest }}
        run: |
          set -eu
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          minor_line="${version%.*}"
          for digest in "$RUNTIME_DIGEST" "$SCHEDULER_DIGEST"; do
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::missing image digest '$digest'"; exit 1 ;;
            esac
          done
          runtime_tags=()
          scheduler_tags=()
          if [ "$LATEST" = true ]; then
            runtime_tags+=(-t "$image:latest")
            scheduler_tags+=(-t "$image:latest-scheduler")
          fi
          if [ "$MINOR" = true ]; then
            runtime_tags+=(-t "$image:$minor_line")
            scheduler_tags+=(-t "$image:$minor_line-scheduler")
          fi
          docker buildx imagetools create "${runtime_tags[@]}" "$image@$RUNTIME_DIGEST"
          docker buildx imagetools create "${scheduler_tags[@]}" "$image@$SCHEDULER_DIGEST"

      - if: steps.decide.outputs.latest != 'true' && steps.decide.outputs.minor != 'true'
        run: echo "v${GITHUB_REF_NAME#v} is not the highest stable tag overall or of its line; latest and X.Y stay where they are"
