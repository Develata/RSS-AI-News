name: release

# 触发：push tag v*（如 v0.1.0 / v0.1.1 / v1.0.0），由 `git push origin <tag>` 触发。
# GitHub Release 由最后的 github-release job 创建：不要先在 Releases 页面手建（已发布的
# 手建 Release 原样保留，draft / prerelease 会让该 job 失败）。
#
# 不触发于 branch push / PR —— release 必须经过显式 tag。
on:
  push:
    tags: ['v*']

# GITHUB_TOKEN 默认 contents:read packages:none；只有 publish-image / promote-tags
# 两个 job 声明 packages:write，只有 github-release 声明 contents:write（另加
# packages:read，只读 `latest` 别名）。
permissions:
  contents: read

env:
  # CARGO_* / RUST_* values are hashed into the rust-cache key: keep them equal
  # to ci.yml so the verify jobs can restore its caches.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 与 rust-toolchain.toml 的 channel 一致（static lane `toolchain-pins` 检查全部 pin）。
  RUST_TOOLCHAIN: "1.97.0"
  # GHCR 镜像名：ghcr.io/<owner>/<repo>。docker/metadata-action 会自动 lowercase
  # github.repository（`Develata/RSS-AI-News` -> `develata/rss-ai-news`）。
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Gate: the tag must name the version the workspace, lockfile, README and
  # binary declare, and on the tagged commit (every job checks out the tag's
  # SHA) the `local` profile (static, workspace, sqlite, release lanes), the
  # postgres lane against a PostgreSQL service and `cargo audit` must pass.
  # Images are only pushed after all four verify jobs succeed.
  #
  # The lanes are split like ci.yml's `test` / `test-pg` jobs and restore the
  # caches those jobs saved on main (same shared-key and env; tag runs may
  # read default-branch caches). save-if is off: a tag-scoped
  # cache is unreachable from later tags. A cache miss only costs time.
  verify-test:
    name: acceptance static + workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - run: (command -v rg && command -v jq) >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ripgrep jq)
      - run: cargo acceptance run --lane static --lane workspace

  verify-release:
    name: acceptance sqlite + release (tag version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-pg
          save-if: false
      - run: cargo acceptance run --lane sqlite --lane release --expected-version "${GITHUB_REF_NAME#v}"

  # Mirrors ci.yml `test-pg` (same service, DATABASE_URL and cache key), for
  # the postgres lane only: sqlite and release already run in verify-release.
  verify-postgres:
    name: acceptance postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-pg
          save-if: false
      - run: cargo acceptance run --lane postgres

  # Same RustSec check as audit.yml / maintenance.yml, on the tagged graph:
  # an advisory published since the last main run blocks the release.
  verify-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/cargo-audit

  # Two stages; the policy lives in .github/scripts/release-promotion.sh
  # (tested offline by the static lane against a fake registry):
  #   1. publish-image pushes only the immutable version tags (X.Y.Z and
  #      X.Y.Z-scheduler), and only while the remote tag still names this
  #      run's commit (R3G-B4). A re-run reuses a version tag already built from
  #      this commit instead of rebuilding it (a rebuild would get a new
  #      digest: the `created` label changes), builds only a missing one, and
  #      fails on one built from another commit (R3-7).
  #   2. promote-tags reconciles latest / X.Y (and their -scheduler twins) to
  #      the highest *released* stable version, whichever tag triggered it, so
  #      a lower version's run still promotes the highest (R3-2, R3-3). It
  #      never moves an alias below the version label it carries, writes
  #      runtime before scheduler aliases with --prefer-index=false and reads
  #      every alias back; a re-run completes an interrupted promotion (R3-4,
  #      R3-22).
  # A prerelease tag never gets here (verify-release only accepts X.Y.Z), and
  # the script refuses anything but X.Y.Z as well.
  publish-image:
    name: publish runtime + scheduler version tags to GHCR
    needs: [verify-test, verify-release, verify-postgres, verify-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One publisher per version: a re-run never races a running attempt.
    concurrency:
      group: release-publish-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      runtime-digest: ${{ steps.existing.outputs.runtime-digest || steps.push-runtime.outputs.digest }}
      scheduler-digest: ${{ steps.existing.outputs.scheduler-digest || steps.push-scheduler.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned Buildx CLI (not the runner's), so imagetools behaves as tested.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2

      # 登录 GHCR：用 GITHUB_TOKEN，无需额外 secret。
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Under the per-version lock, before the first push: the remote tag must
      # still name this run's commit. A re-run keeps the original GITHUB_SHA;
      # if vX.Y.Z moved meanwhile, pushing would claim the immutable version
      # tag for the old commit and block the new commit's run (R3G-B4).
      - name: the tag still names this commit
        run: |
          set -euo pipefail
          ref="refs/tags/${GITHUB_REF_NAME}"
          git ls-remote origin "$ref" "${ref}^{}" \
            | sh .github/scripts/release-promotion.sh tag-commit "${GITHUB_REF_NAME#v}" "$GITHUB_SHA"

      # Digests of version tags already built from this commit (empty = build).
      # "Missing" is only an authenticated exact-tag manifest HEAD answering
      # 404 (release-registry.sh, R4-2); the adapter gets its token from GHCR
      # with the same credential as the login above.
      - id: existing
        name: reuse version tags built from this commit
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          sh .github/scripts/release-promotion.sh existing "$image" "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" \
            | tee -a "$GITHUB_OUTPUT"

      # Version tag only (v0.1.0 -> 0.1.0); the moving tags are promote-tags'.
      # metadata-action lowercases the image name and supplies the OCI labels.
      # `latest=false`: its default flavor (`latest=auto`) adds `latest` for
      # every type=semver tag, which would move latest here, before both
      # images exist and regardless of tag order.
      - id: meta-runtime
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      # 复用 ci.yml docker-build job 的 buildx cache（scope=runtime），避免
      # release 重新编译整个 Rust workspace。
      - name: build + push runtime image
        id: push-runtime
        if: steps.existing.outputs.runtime-digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          # Read main's cache only: a tag-scoped cache is unreachable from later
          # tags and main, so exporting one would only cost time and quota.
          cache-from: type=gha,scope=runtime

      # scheduler image（runtime 镜像之上叠一层 supercronic + entrypoint，用于
      # 「常驻容器内置 cron 周期触发 single-shot CLI」部署模式）：
      #   v0.1.0 -> 0.1.0-scheduler
      - id: meta-scheduler
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-scheduler
          tags: |
            type=semver,pattern={{version}}

      - name: build + push scheduler image
        id: push-scheduler
        if: steps.existing.outputs.scheduler-digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: true
          tags: ${{ steps.meta-scheduler.outputs.tags }}
          labels: ${{ steps.meta-scheduler.outputs.labels }}
          cache-from: type=gha,scope=runtime

  promote-tags:
    name: reconcile latest / X.Y tags
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # One reconcile at a time across tags. `queue: max` keeps up to 100
    # waiting runs instead of the default single pending slot, in which a
    # later (possibly lower) tag's run would cancel a waiting one. latest does
    # not depend on it: every run reconciles latest to the highest released
    # version. A run touches only latest, its trigger's X.Y line and latest's
    # line, so a cancelled or dropped run is completed by re-running a release
    # of the affected X.Y line (docs/operations/ci-and-release.md, R3G-S3).
    # `queue` is in GitHub's workflow schema for job concurrency; actionlint
    # 1.7.12 does not know it yet (.github/actionlint.yaml).
    concurrency:
      group: release-promote-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The checkout is shallow and holds only this tag, so list the remote's
      # tags (with the peeled commit of annotated tags). The registry, not the
      # previous job's outputs, is the source of truth for every digest: the
      # script reads each released version's tags and every alias.
      - name: reconcile aliases to the highest released version
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          tags="$(mktemp)"
          git ls-remote --tags origin 'refs/tags/v*' >"$tags"
          {
            echo '### Image aliases'
            echo '```text'
            sh .github/scripts/release-promotion.sh reconcile "$image" "${GITHUB_REF_NAME#v}" <"$tags" 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The GitHub Release of the tag, last: a failure here leaves the images and
  # aliases as they are, and re-running this job alone completes it. Policy
  # in .github/scripts/release-github.sh (tested offline by the static lane
  # against a fake GitHub):
  #   - the body is the release report's marked notes section at the tag
  #     (verify-release already ran the same extraction), plus a link to the
  #     report on main, where the post-release evidence is added;
  #   - Latest follows the `latest` image alias: read here, not handed over
  #     from promote-tags (stale once another tag's promotion ran in between),
  #     under one serialized group across tags, so two runs' alias read and
  #     Latest write never interleave;
  #   - a published Release is never rewritten; a draft or prerelease one, or
  #     several for the tag, fail with nothing written;
  #   - `gh release create --verify-tag` never creates a tag, and the remote
  #     tag must still name this run's commit, as in publish-image.
  # `queue` is in GitHub's job concurrency schema; see promote-tags.
  github-release:
    name: publish the GitHub Release
    needs: [promote-tags]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    concurrency:
      group: release-github-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: the tag still names this commit
        run: |
          set -euo pipefail
          ref="refs/tags/${GITHUB_REF_NAME}"
          git ls-remote origin "$ref" "${ref}^{}" \
            | sh .github/scripts/release-promotion.sh tag-commit "${GITHUB_REF_NAME#v}" "$GITHUB_SHA"

      # Reading the alias's labels goes through `imagetools inspect`
      # (release-registry.sh), as in promote-tags.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create or complete the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          report="docs/reports/releases/v${version}.md"
          notes="$(mktemp)"
          sh .github/scripts/release-github.sh notes "$version" "$report" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/${report}" >"$notes"
          latest="$(sh .github/scripts/release-promotion.sh alias-version "$image" latest)"
          {
            echo '### GitHub Release'
            echo '```text'
            sh .github/scripts/release-github.sh ensure "$version" "$latest" "$notes" 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
