name: maintenance

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # rsa remains only in the lockfile's inactive optional dependency graph.
      # The separate policy fails if a feature change activates it.
      - run: bash .ci/check_dependency_security_policy.sh
      - run: cargo audit --ignore RUSTSEC-2023-0071

  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin rss-ai-news
      - run: sudo apt-get update && sudo apt-get install -y time
      - run: python3 tools/perf/run.py --output perf.json
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-perf
          path: perf.json
