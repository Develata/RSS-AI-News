name: maintenance

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      # Same check as the path-filtered audit workflow; here it also catches
      # new advisories against an unchanged graph.
      - uses: ./.github/actions/cargo-audit

  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --bin rss-ai-news
      - run: sudo apt-get update && sudo apt-get install -y time
      - run: python3 tools/perf/run.py --output perf.json
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-perf
          path: perf.json
