name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch / PR — saves runner minutes when
# the developer pushes again before CI finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin once. Bumping is a deliberate single-line change; keeps Dockerfile and
  # all four jobs in lockstep.
  RUST_TOOLCHAIN: "1.94.0"

# All four jobs are independent on purpose: each prepares its own toolchain /
# cache and validates a different surface (style, behavior, migration, image).
# Removing the previous needs: chains lets a slow stage (docker-build) start
# at t=0 instead of waiting on lint / test.
jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  migration-smoke:
    name: migration smoke (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: migration-smoke
      - name: build binary
        run: cargo build --release --bin rss-ai-news --locked
      - name: prepare workspace
        run: |
          mkdir -p smoke/configs/categories smoke/data
          cp configs/app.toml.example smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: migrate run
        run: |
          ./target/release/rss-ai-news \
            --config-dir smoke/configs \
            --db-path smoke/data/smoke.db \
            migrate run
      - name: migrate check
        run: |
          ./target/release/rss-ai-news \
            --config-dir smoke/configs \
            --db-path smoke/data/smoke.db \
            migrate check

  # W11-P4-A：postgres 路径 CI 覆盖。
  #
  # services.postgres 给所有步骤暴露一个 :5432 的 PG 16-alpine 实例，与
  # storage 内 testcontainers fixture 共用同一镜像版本（保证 schema 翻译
  # 测试与 CI 跑的是同一 PG 服务器版本）。
  #
  # 三层覆盖：
  #   1. storage --include-ignored 跑所有 PG-only / 双轨 smoke 测试（~50 条）
  #   2. cli `migrate run/check` 在 DATABASE_URL=postgres://... 下 smoke 跑
  #      端到端 apply 路径（与 SQLite migration-smoke job 对称）
  #   3. testcontainers 测试沿用 docker.sock；GitHub runner 内置 docker
  #
  # 不跑 lint / 整 workspace test —— 那两条已由 `lint` / `test` job 覆盖。
  # 这里专注 PG-only 增量，避免重复 ~3-5 min 编译。
  test-pg:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        # GH Actions services 标准 health-check 模式：让后续步骤等 PG ready。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # storage testcontainers fixture 自己拉容器；本 env 仅给 cli migrate
      # smoke 用，明确 DATABASE_URL 指向 service postgres。
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-pg
      # P3-C-0 testcontainers fixture + P3-A 直接 build_pg_pool 测试默认 #[ignore]，
      # CI 用 --include-ignored 强制跑。串行执行避免 ~50 个测试同时打 PG 容器
      # 上限连接（fixture pool max=4 + admin pool max=8 + ~10 个 test bin 并发 =
      # 远超 PG 默认 max_connections=100，但保守起见 --test-threads=1 串行）。
      - name: cargo test storage PG include-ignored
        run: cargo test -p rss-ai-news-storage --locked -- --include-ignored --test-threads=1
      # cli migrate smoke：DATABASE_URL=postgres:// 触发 PG 路径，apply 0001+0002，
      # check 在已 apply 的库上 idempotent。
      - name: build binary
        run: cargo build --release --bin rss-ai-news --locked
      - name: prepare smoke configs (driver=postgres)
        run: |
          mkdir -p smoke/configs/categories
          cp configs/app.toml.example smoke/configs/app.toml
          # 覆盖 app.toml：database.driver=postgres + 留 sqlite_path 占位（被 driver 路由忽略）
          # 详见 docs/design/storage-multi-dialect.md §5.4
          sed -i 's/^driver = .*/driver = "postgres"/' smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: migrate run (postgres)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          ./target/release/rss-ai-news \
            --config-dir smoke/configs \
            migrate run
      - name: migrate check (postgres)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          ./target/release/rss-ai-news \
            --config-dir smoke/configs \
            migrate check

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: rss-ai-news:runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: build debug image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: debug
          push: false
          load: true
          tags: rss-ai-news:debug
          cache-from: type=gha,scope=debug
          cache-to: type=gha,mode=max,scope=debug
      - name: build scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: false
          load: true
          tags: rss-ai-news:scheduler
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=scheduler
      - name: smoke run --help (runtime)
        run: docker run --rm rss-ai-news:runtime --help
      - name: smoke run --help (debug)
        run: docker run --rm rss-ai-news:debug --help
      # scheduler 入口是 supercronic 长驻；smoke 用一个永不到期的 cron
      # 表达式启动 5s 后强制停。能起即视为通过（验证 supercronic 安装 +
      # entrypoint script 解析 + USER appuser 权限正常）。
      - name: smoke scheduler boot
        run: |
          docker run --rm -d --name scheduler-smoke \
            -e RSS_CRON_SCHEDULE='0 0 1 1 *' \
            -e RSS_CRON_COMMAND='--help' \
            rss-ai-news:scheduler
          sleep 3
          docker logs scheduler-smoke
          if ! docker ps --filter name=scheduler-smoke --filter status=running -q | grep -q .; then
            echo "::error::scheduler container exited unexpectedly"
            exit 1
          fi
          docker stop scheduler-smoke
      # validate-config 不需要外部凭据；只需要示例 config 触发 W3 fail-fast 校验。
      # 容器启动 + 配置加载 + 错误退出码 78 (ConfigError) 一并被 smoke 覆盖。
      - name: prepare smoke config
        run: |
          mkdir -p smoke/configs/categories
          cp configs/app.toml.example smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: smoke validate-config (runtime, expect exit 78)
        run: |
          set +e
          docker run --rm -v "$PWD/smoke/configs:/app/configs:ro" \
            rss-ai-news:runtime --config-dir /app/configs validate-config
          code=$?
          set -e
          if [ "$code" -ne 78 ]; then
            echo "::error::expected exit 78 (ConfigError), got $code"
            exit 1
          fi
          echo "validate-config produced expected exit 78"
