name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: CI builds, tests and loads images locally,
# it never writes to the repository or a registry.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR — saves runner minutes when
# the developer pushes again before CI finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rust-toolchain.toml's channel is the source of truth. The same version is
  # also written here, in release.yml, audit.yml, maintenance.yml (x2) and
  # docker/Dockerfile; a bump changes all of them, and the static acceptance
  # lane (`toolchain-pins`) fails if any one drifts.
  RUST_TOOLCHAIN: "1.97.0"

# Three independent jobs, grouped by what they compile: `test` runs the static
# and workspace lanes (dev / clippy artifacts), `test-pg` runs the postgres,
# sqlite and release lanes (one shared release build), and docker-build builds
# the images. The lanes come from the Rust acceptance matrix (`cargo
# acceptance`, tools/acceptance/), so CI and the local pre-tag matrix run the
# same checks from one source of truth; see docs/operations/acceptance-matrix.md.
# The runner does not fail fast: every lane in a job reports even after an
# earlier lane fails. docker-build keeps build-push-action because release.yml
# reuses its GHA buildx cache.
#
# rust-cache: release.yml restores these keys from main, so the shared-keys and
# the CARGO_* / RUST_* env (hashed into the key) must match there. The
# environment hash stays on: turning it off also drops the Cargo.lock hash, so
# the key would never change and the cache would never refresh. Only main
# saves: caches saved under a PR ref are unreachable from main and would only
# crowd the quota.
jobs:
  test:
    name: fmt + clippy + cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The swallowed-error gate needs ripgrep, which the current ubuntu
      # runner image does not ship.
      - run: command -v rg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ripgrep)
      # static first, so fmt / clippy findings lead the log: fmt, clippy
      # -D warnings, swallowed-error gate, dependency policy, tooling boundary,
      # acceptance-case status; then the locked workspace build and tests.
      - run: cargo acceptance run --lane static --lane workspace

  # postgres: the ignored (PG / Docker) storage tests (--ignored; the normal
  # ones run in the workspace lane) plus CLI migrate run/check
  # against the service below (the lane requires DATABASE_URL and the docker
  # CLI; storage fixtures use the runner's docker daemon). sqlite and release
  # reuse its release build: SQLite migrate run/check, recent-entries and the
  # JSON output contract on the real binary, then version / lockfile / README /
  # binary identity. Product smokes strip the inherited DATABASE_URL, so the
  # sqlite lane stays on SQLite.
  test-pg:
    name: postgres + sqlite + release lanes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-pg
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Storage PG tests stay --test-threads=1: measured 108s vs 99s at 4
      # threads (per-binary container/schema setup dominates, and Cargo runs
      # test binaries serially), not worth the extra contention risk.
      - run: cargo acceptance run --lane postgres --lane sqlite --lane release

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: rss-ai-news:runtime
          cache-from: type=gha,scope=runtime
          # Only main writes caches (as with rust-cache): PR / other-ref entries are
          # unreachable from main and only consume the cache quota.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=runtime' || '' }}
      - name: build debug image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: debug
          push: false
          load: true
          tags: rss-ai-news:debug
          cache-from: type=gha,scope=debug
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=debug' || '' }}
      - name: build scheduler image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: false
          load: true
          tags: rss-ai-news:scheduler
          # Reads the runtime layers it shares; writes nothing. A scheduler scope
          # was never read by CI or release and only took cache quota.
          cache-from: type=gha,scope=runtime
      - name: smoke run --help (runtime)
        run: docker run --rm rss-ai-news:runtime --help
      - name: smoke run --help (debug)
        run: docker run --rm rss-ai-news:debug --help
      # scheduler: supercronic must actually run one job from the env-mode
      # line. The 7-field schedule (seconds first) fires every 2 s. The job is
      # side-effect free: clap rejects the extra positional before any config
      # or database access. Its argument contains a space, so the logged
      # "unexpected argument 'spaced arg'" proves the generated line kept it
      # as one argv element (nested quoting used to split it into `spaced`).
      # Polls for up to 75 s; fails early if the container exits.
      - name: smoke scheduler runs a job
        run: |
          docker run -d --name scheduler-smoke \
            -e RSS_CRON_SCHEDULE='*/2 * * * * * *' \
            -e "RSS_CRON_COMMAND=validate-config 'spaced arg'" \
            rss-ai-news:scheduler
          ran=""
          for _ in $(seq 1 75); do
            if docker logs scheduler-smoke 2>&1 | grep -qF "unexpected argument 'spaced arg'"; then
              ran=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' scheduler-smoke)" != true ]; then
              break
            fi
            sleep 1
          done
          docker logs scheduler-smoke
          docker rm -f scheduler-smoke >/dev/null
          if [ -z "$ran" ]; then
            echo "::error::scheduler did not run the job with its argv intact"
            exit 1
          fi
      # validate-config 不需要外部凭据；只需要示例 config 触发 W3 fail-fast 校验。
      # 容器启动 + 配置加载 + 错误退出码 78 (ConfigError) 一并被 smoke 覆盖。
      - name: prepare smoke config
        run: |
          mkdir -p smoke/configs/categories
          cp configs/app.toml.example smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: smoke validate-config (runtime, expect exit 78)
        run: |
          set +e
          docker run --rm -v "$PWD/smoke/configs:/app/configs:ro" \
            rss-ai-news:runtime --config-dir /app/configs validate-config
          code=$?
          set -e
          if [ "$code" -ne 78 ]; then
            echo "::error::expected exit 78 (ConfigError), got $code"
            exit 1
          fi
          echo "validate-config produced expected exit 78"
