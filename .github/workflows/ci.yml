name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch / PR — saves runner minutes when
# the developer pushes again before CI finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin once. Bumping is a deliberate single-line change; keeps Dockerfile and
  # all four jobs in lockstep.
  RUST_TOOLCHAIN: "1.94.0"

# All four jobs are independent on purpose: each prepares its own toolchain /
# cache and validates a different surface (style, behavior, migration, image).
# Removing the previous needs: chains lets a slow stage (docker-build) start
# at t=0 instead of waiting on lint / test.
jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  migration-smoke:
    name: migration smoke (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: migration-smoke
      - name: build binary
        run: cargo build --release --bin rss-ai-news --locked
      - name: prepare workspace
        run: |
          mkdir -p smoke/configs/categories smoke/data
          cp configs/app.toml.example smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: migrate run
        run: |
          ./target/release/rss-ai-news \
            --config-dir smoke/configs \
            --db-path smoke/data/smoke.db \
            migrate run
      - name: migrate check
        run: |
          ./target/release/rss-ai-news \
            --config-dir smoke/configs \
            --db-path smoke/data/smoke.db \
            migrate check

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: rss-ai-news:runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: build debug image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: debug
          push: false
          load: true
          tags: rss-ai-news:debug
          cache-from: type=gha,scope=debug
          cache-to: type=gha,mode=max,scope=debug
      - name: smoke run --help (runtime)
        run: docker run --rm rss-ai-news:runtime --help
      - name: smoke run --help (debug)
        run: docker run --rm rss-ai-news:debug --help
      # validate-config 不需要外部凭据；只需要示例 config 触发 W3 fail-fast 校验。
      # 容器启动 + 配置加载 + 错误退出码 78 (ConfigError) 一并被 smoke 覆盖。
      - name: prepare smoke config
        run: |
          mkdir -p smoke/configs/categories
          cp configs/app.toml.example smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: smoke validate-config (runtime, expect exit 78)
        run: |
          set +e
          docker run --rm -v "$PWD/smoke/configs:/app/configs:ro" \
            rss-ai-news:runtime --config-dir /app/configs validate-config
          code=$?
          set -e
          if [ "$code" -ne 78 ]; then
            echo "::error::expected exit 78 (ConfigError), got $code"
            exit 1
          fi
          echo "validate-config produced expected exit 78"
