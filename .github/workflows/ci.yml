name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch / PR — saves runner minutes when
# the developer pushes again before CI finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin once. Bumping is a deliberate single-line change; keeps Dockerfile,
  # every job here and release.yml in lockstep.
  RUST_TOOLCHAIN: "1.97.0"

# Three independent jobs, grouped by what they compile: `test` runs the static
# and workspace lanes (dev / clippy artifacts), `test-pg` runs the postgres,
# sqlite and release lanes (one shared release build), and docker-build builds
# the images. The lanes come from the Rust acceptance matrix (`cargo
# acceptance`, tools/acceptance/), so CI and the local pre-tag matrix run the
# same checks from one source of truth; see docs/operations/acceptance-matrix.md.
# The runner does not fail fast: every lane in a job reports even after an
# earlier lane fails. docker-build keeps build-push-action because release.yml
# reuses its GHA buildx cache.
#
# rust-cache keys: the toolchain is part of shared-key and the environment hash
# is off, so a runner-image update of its preinstalled stable Rust (unused:
# rust-toolchain.toml pins ours) no longer invalidates every cache; Cargo
# fingerprints still rebuild whatever a rustc / flag change affects.
# release.yml restores these same keys from main. Only main saves: caches saved
# under a PR ref are unreachable from main and would only crowd the quota.
jobs:
  test:
    name: fmt + clippy + cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ env.RUST_TOOLCHAIN }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The swallowed-error gate needs ripgrep, which the current ubuntu
      # runner image does not ship.
      - run: command -v rg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ripgrep)
      # static first, so fmt / clippy findings lead the log: fmt, clippy
      # -D warnings, swallowed-error gate, dependency policy, tooling boundary,
      # acceptance-case status; then the locked workspace build and tests.
      - run: cargo acceptance run --lane static --lane workspace

  # postgres: storage tests with --include-ignored plus CLI migrate run/check
  # against the service below (the lane requires DATABASE_URL and the docker
  # CLI; storage fixtures use the runner's docker daemon). sqlite and release
  # reuse its release build: SQLite migrate run/check, recent-entries and the
  # JSON output contract on the real binary, then version / lockfile / README /
  # binary identity. Product smokes strip the inherited DATABASE_URL, so the
  # sqlite lane stays on SQLite.
  test-pg:
    name: postgres + sqlite + release lanes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-pg-${{ env.RUST_TOOLCHAIN }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Storage PG tests stay --test-threads=1: measured 108s vs 99s at 4
      # threads (per-binary container/schema setup dominates, and Cargo runs
      # test binaries serially), not worth the extra contention risk.
      - run: cargo acceptance run --lane postgres --lane sqlite --lane release

  docker-build:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: rss-ai-news:runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: build debug image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: debug
          push: false
          load: true
          tags: rss-ai-news:debug
          cache-from: type=gha,scope=debug
          cache-to: type=gha,mode=max,scope=debug
      - name: build scheduler image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: false
          load: true
          tags: rss-ai-news:scheduler
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=scheduler
      - name: smoke run --help (runtime)
        run: docker run --rm rss-ai-news:runtime --help
      - name: smoke run --help (debug)
        run: docker run --rm rss-ai-news:debug --help
      # scheduler 入口是 supercronic 长驻；smoke 用一个永不到期的 cron
      # 表达式启动 5s 后强制停。能起即视为通过（验证 supercronic 安装 +
      # entrypoint script 解析 + USER appuser 权限正常）。
      - name: smoke scheduler boot
        run: |
          docker run --rm -d --name scheduler-smoke \
            -e RSS_CRON_SCHEDULE='0 0 1 1 *' \
            -e RSS_CRON_COMMAND='--help' \
            rss-ai-news:scheduler
          sleep 3
          docker logs scheduler-smoke
          if ! docker ps --filter name=scheduler-smoke --filter status=running -q | grep -q .; then
            echo "::error::scheduler container exited unexpectedly"
            exit 1
          fi
          docker stop scheduler-smoke
      # validate-config 不需要外部凭据；只需要示例 config 触发 W3 fail-fast 校验。
      # 容器启动 + 配置加载 + 错误退出码 78 (ConfigError) 一并被 smoke 覆盖。
      - name: prepare smoke config
        run: |
          mkdir -p smoke/configs/categories
          cp configs/app.toml.example smoke/configs/app.toml
          cp configs/categories/ai.toml.example smoke/configs/categories/ai.toml
      - name: smoke validate-config (runtime, expect exit 78)
        run: |
          set +e
          docker run --rm -v "$PWD/smoke/configs:/app/configs:ro" \
            rss-ai-news:runtime --config-dir /app/configs validate-config
          code=$?
          set -e
          if [ "$code" -ne 78 ]; then
            echo "::error::expected exit 78 (ConfigError), got $code"
            exit 1
          fi
          echo "validate-config produced expected exit 78"
